# Severe shift — heavy archetype/industry drift. This is the stream on which the falsifiable
# claim is checked: the naive confidence-threshold baseline violates r* in >50% of runs
# (test_naive_baseline.py), while the guaranteed field loop holds r* (field_loop, step 6).
r_star: 0.05
delta: 0.05
gamma: 0.02          # effective ACI step size: experiment/report.py uses max(gamma, 0.02); the old
                     # value 0.005 was written here but never used (see report/ABLATION_ACI.md)
alpha: 0.10
reviewer_budget_per_batch: 40
seeds: [1, 2, 3, 4, 5, 6, 7, 8]

stream:
  n_cases: 2000
  fields_per_case: 6
  exchangeable: false
  drift_strength: 0.60           # strong long-run familiarity decline (see ood-by-window)
  seasonality_amplitude: 0.10
  seasonality_period: 120
  industry_cluster_length: 45    # long OOD industry clusters (broker-channel batching)
  broker_batch_length: 25
  campaign_burst_prob: 0.06      # frequent OOD campaign floods
  campaign_burst_length: 15
  ood_error_gain: 0.07           # overconfidence-under-shift: error climbs while confidence stays high
  confidence_truth_corr: 0.70   # F3: confidence is a partial predictor (r2~0.49)
  err_intercept: 0.05           # base error at the median latent (q=0)
  err_latent_slope: 0.17        # the LATENT drives error, not the observed confidence
  err_floor: 0.002
  err_cap: 0.95
  overconfidence: 0.80
  overconfidence_sd: 0.13

scoring:
  normalized: true

baseline_experiment:
  n_runs: 300
  window: 200
