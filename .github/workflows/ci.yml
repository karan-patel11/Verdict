name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Verdictproject
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e . pytest
      - run: python -m pytest tests -q
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node --test frontend/tests/graph.test.mjs
# The lockbox/test-set run never executes in CI: it is a manual, logged, once-only action.
